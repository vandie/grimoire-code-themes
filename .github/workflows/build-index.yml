name: Build Index

on:
  push:
    branches:
      - main
    paths:
      - "**/*.json"
      - "!scripts/**"
      - "build-index.js"
      - "package.json"
      - ".github/workflows/build-index.yml"
  pull_request:
    branches:
      - main
    paths:
      - "**/*.json"
      - "!scripts/**"
      - "build-index.js"
      - "package.json"
      - ".github/workflows/build-index.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Regenerate index
        run: node build-index.js

      - name: Verify index is current (PRs)
        if: github.event_name == 'pull_request'
        run: node build-index.js --check

      - name: Commit and push changes
        if: github.event_name == 'push'
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json README.md

          if git diff --staged --quiet; then
            echo "No changes to index.json or README.md. Skipping commit."
          else
            git commit -m "chore: auto-regenerate index.json [skip ci]"
            git push || {
              git pull --rebase
              git push
            }
          fi
